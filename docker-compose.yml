services:
  db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon
      POSTGRES_DB: reconciliation
    ports:
      - "54329:5432"
    volumes:
      - recon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon -d reconciliation"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  recon_pgdata:
